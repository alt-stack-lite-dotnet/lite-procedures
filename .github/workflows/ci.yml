# CI: сборка и тесты на push/PR; pack и push в NuGet только при теге v* с ветки release.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

env:
  RELEASE_BRANCH: release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Lite.Procedures.sln

      - name: Build
        run: dotnet build Lite.Procedures.sln -c Release --no-restore

      - name: Test
        run: dotnet test Lite.Procedures.sln -c Release --no-build --verbosity normal

  pack:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on release branch
        id: check-release
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref }}")
          git fetch origin ${{ env.RELEASE_BRANCH }} 2>/dev/null || true
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/${{ env.RELEASE_BRANCH }} 2>/dev/null; then
            echo "on_release=true" >> $GITHUB_OUTPUT
          else
            echo "on_release=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ github.ref }} is not on branch ${{ env.RELEASE_BRANCH }}. Skipping pack and NuGet push."
          fi

      - name: Install .NET SDK
        if: steps.check-release.outputs.on_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        if: steps.check-release.outputs.on_release == 'true'
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack
        if: steps.check-release.outputs.on_release == 'true'
        run: |
          dotnet restore Lite.Procedures.sln
          dotnet pack Lite.Procedures.sln -c Release -o out \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --no-restore

      - name: Upload NuGet packages
        if: steps.check-release.outputs.on_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: out/*.nupkg

      - name: Push to NuGet
        if: steps.check-release.outputs.on_release == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set; skipping push (artifacts are uploaded)."
            exit 0
          fi
          for f in out/*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
