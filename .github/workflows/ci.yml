# CI: сборка и тесты на push/PR; pack и push в NuGet только при теге v* с ветки release.
#
# Чтобы запустить CI по тегу:
#   1. Убедись, что .github/workflows/ci.yml закоммичен и запушен.
#   2. Создай тег: git tag v1.0.0
#   3. Запушь тег: git push origin v1.0.0  (без push тег не уйдёт на GitHub — ничего не запустится).
# Pack/NuGet push выполнится только если тег стоит на ветке release.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

env:
  RELEASE_BRANCH: release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Lite.Procedures.sln

      - name: Build
        run: dotnet build Lite.Procedures.sln -c Release --no-restore

      - name: Test
        run: dotnet test Lite.Procedures.sln -c Release --no-build --verbosity normal

  pack:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for NuGet Trusted Publishing (OIDC token issuance)
    env:
      RELEASE_BRANCH: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on release branch
        id: check-release
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref }}")
          git fetch origin ${{ env.RELEASE_BRANCH }} 2>/dev/null || true
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/${{ env.RELEASE_BRANCH }} 2>/dev/null; then
            echo "on_release=true" >> $GITHUB_OUTPUT
          else
            echo "on_release=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ github.ref }} is not on branch ${{ env.RELEASE_BRANCH }}. NuGet push will be skipped (artifacts still built)."
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: |
          dotnet restore Lite.Procedures.sln
          dotnet pack Lite.Procedures.sln -c Release -o out \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --no-restore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: out/*.nupkg

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1h) nuget.org API key.
      # No long-lived NUGET_API_KEY secret needed; requires a trusted publishing policy on nuget.org
      # (Repository Owner + Repository + Workflow File = ci.yml) and the NUGET_USER secret = nuget.org
      # profile name. Done right before push since the key is only valid for one hour.
      - name: NuGet login (OIDC -> short-lived API key)
        if: steps.check-release.outputs.on_release == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: steps.check-release.outputs.on_release == 'true'
        run: |
          for f in out/*.nupkg; do
            dotnet nuget push "$f" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
